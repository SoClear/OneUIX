name: CI

# 触发条件：所有分支的 push 和 PR 都会触发
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      # 仓库内的构建使用与 Release 相同的签名，以便互相覆盖安装。
      # Fork PR 无法访问 Secrets，因此只做编译检查，不上传 APK。
      - name: Set up signing
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are not fully configured"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 获取当前 commit 的前 7 位短 Hash，并存入环境变量 SHORT_SHA 中
      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 构建 Debug 包
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Verify Debug signature
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          EXPECTED_CERT_SHA256: 3cfb2d32db4526e9cce22a0092a7d6819659db433cfec613fed68d44d999682a
        run: |
          APK_PATH=app/build/outputs/apk/debug/app-debug.apk
          if [ -z "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME is not configured"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found"
            exit 1
          fi
          SIGNATURE_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")
          ACTUAL_CERT_SHA256=$(printf '%s\n' "$SIGNATURE_INFO" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected signing certificate: $ACTUAL_CERT_SHA256"
            exit 1
          fi
          echo "Verified signing certificate: $ACTUAL_CERT_SHA256"

      # 重命名 Debug 包
      # github.ref_name: 分支名 (例如 main)
      # github.run_number: Actions 的历史运行编号 (例如 15)
      # env.SHORT_SHA: 刚刚获取的 7 位 commit 标识 (例如 a1b2c3d)
      - name: Rename APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          SAFE_BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-${SAFE_BRANCH_NAME}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}.apk"

      # 上传产物
      - name: Upload APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          # name: OneUIX-Debug-${{ github.ref_name }}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
